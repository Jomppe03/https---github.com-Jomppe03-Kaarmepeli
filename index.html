<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
        .game-container {
            position: relative;
            display: inline-block;
        }
        #startScreen {
            position: absolute;
            inset: 0;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <div class="game-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="startScreen">
        <button id="startButton">Start</button>
    </div>
</div>
    <p id="info"></p>
    <button id="restartButton">Aloita uudelleen</button>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        let gameOver = false;
        let gameInterval;
        let gameSpeed = 150; // Initial game speed in milliseconds
        let nextDirection = direction; // Initialize nextDirection to the current direction
        let canChangeDirection = true;

        // ===== DRAWING =====
        const drawGame = () => {
           const colorProgress = Math.min(score / 40, 1);
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

                if(score >= 40) {ctx.fillStyle = "black";}
                    else if(score >= 30) {ctx.fillStyle = "darkgray";}
                    else if(score >= 20) {ctx.fillStyle = "darkred";}
                    else if(score >= 10) {ctx.fillStyle = "brown";}
                    else {ctx.fillStyle = "yellow";}
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );
            const red = Math.floor(255 * colorProgress);
            const green = Math.floor(128 + 87 * colorProgress);
            

            for (const segment of snake) {
    ctx.fillStyle = `rgb(${red}, ${green}, 0)`;
    ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
                if (segment === snake[0]) {
                    ctx.fillStyle = "White";
                    if(direction.x === 1) {
                        ctx.fillRect(segment.x * gridSize + 14, segment.y * gridSize + 4, 3, 3);
                        ctx.fillRect(segment.x * gridSize + 14, segment.y * gridSize + 13, 3, 3);
                    } else if (direction.x === -1) {
                        ctx.fillRect(segment.x * gridSize + 3, segment.y * gridSize + 4, 3, 3);
                        ctx.fillRect(segment.x * gridSize + 3, segment.y * gridSize + 13, 3, 3);
                    } else if (direction.y === -1) {
                        ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 3, 3, 3);
                        ctx.fillRect(segment.x * gridSize + 13, segment.y * gridSize + 3, 3, 3);
                    } else if (direction.y === 1) {
                        ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 14, 3, 3);
                        ctx.fillRect(segment.x * gridSize + 13, segment.y * gridSize + 14, 3, 3);
                    }   
                    if (direction.x === 1) {
                        ctx.fillStyle = "red";
                        ctx.fillRect(segment.x * gridSize + gridSize, segment.y * gridSize + 9, 5, 2);
                    } else if (direction.x === -1) {
                        ctx.fillStyle = "red";
                        ctx.fillRect(segment.x * gridSize - 5, segment.y * gridSize + 9, 5, 2);
                    } else if (direction.y === -1) {
                        ctx.fillStyle = "red";
                        ctx.fillRect(segment.x * gridSize + 9, segment.y * gridSize - 5, 2, 5);
                    } else if (direction.y === 1) {
                        ctx.fillStyle = "red";
                        ctx.fillRect(segment.x * gridSize + 9, segment.y * gridSize + gridSize, 2, 5);
                    }      
    }
            }
             document.getElementById("info").textContent =
    `Pisteet: ${score}`;

    


        };

        drawGame();
        document.addEventListener("keydown", function(event){
            if (gameOver) return;
            else if (!canChangeDirection) return;
            else if (event.key === "ArrowUp" && direction.y === 0) {
                nextDirection = { x: 0, y: -1 };
                canChangeDirection = false;
            } else if (event.key === "ArrowDown" && direction.y === 0) {
                nextDirection = { x: 0, y: 1 };
                canChangeDirection = false;
            } else if (event.key === "ArrowLeft" && direction.x === 0) {
                nextDirection = { x: -1, y: 0 };
                canChangeDirection = false;
            } else if (event.key === "ArrowRight" && direction.x === 0) {
                nextDirection = { x: 1, y: 0 };
                canChangeDirection = false;
            }

            // Tarkista painettu näppäin event.key-arvosta
    // Päivitä suunta täällä
});

        function placeFood(){
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            for (let i = 0; i < snake.length; i++) {
                if (food.x === snake[i].x && food.y === snake[i].y) {
                    placeFood(); 
                    return;
                }
            }


        }


        function moveSnake() {
        direction = nextDirection;
        canChangeDirection = true;
        const head = snake[0];
        const newHead = {
            x: head.x + direction.x,
            y: head.y + direction.y
        };
        if(newHead.x < 0 || newHead.x >= tileCount || newHead.y < 0 || newHead.y >= tileCount){
            clearInterval(gameInterval); 
            gameOver = true;
            document.getElementById("info").textContent =
    `Peli päättyi! Pisteet: ${score}`; 
            return;}
    
        const ateFood = newHead.x === food.x && newHead.y === food.y;
        if (ateFood) {
    score++; 
    if(score >= 40) {gameSpeed = 70;}
        else if(score >= 30) {gameSpeed = 90;}
        else if(score >= 20) {gameSpeed = 110;}
        else if(score >= 10) {gameSpeed = 130;}
        else {gameSpeed = 150;}
    clearInterval(gameInterval);
    gameInterval = setInterval(moveSnake, gameSpeed);
                
    document.getElementById("info").textContent =
    `Pisteet: ${score}`;

} else {snake.pop();}

for (let i = 0; i < snake.length; i++) {
    // tarkista snake[i]
    if (newHead.x === snake[i].x && newHead.y === snake[i].y) {
        clearInterval(gameInterval); 
        gameOver = true; 
        document.getElementById("info").textContent =
    `Peli päättyi! Pisteet: ${score}`;
        return;
    }
}


snake.unshift(newHead);
if (ateFood) {
    placeFood();}

        drawGame();
    }

    document.getElementById("restartButton").addEventListener("click", function() {
        gameOver = false;
        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        direction = { x: 1, y: 0 };
        food = { x: 15, y: 15 };
        score = 0;
        gameSpeed = 150;
        nextDirection = direction;
        canChangeDirection = true;
        document.getElementById("info").textContent = `Pisteet: ${score}`;
        clearInterval(gameInterval);
        drawGame();
        gameInterval = setInterval(moveSnake, gameSpeed);

});

    document.getElementById("startButton").addEventListener("click", function() {
        document.getElementById("startScreen").style.display = "none";
        if (!gameInterval) {
            gameInterval = setInterval(moveSnake, gameSpeed);
        }
    });

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
