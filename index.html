<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p id="info"></p>
    <button id="restartButton">Aloita uudelleen</button>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        let gameOver = false;
        let gameInterval;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
             document.getElementById("info").textContent =
    `Pisteet: ${score}`;

        };

        drawGame();
        document.addEventListener("keydown", function(event){
            if (gameOver) return;
            else if (event.key === "ArrowUp" && direction.y === 0) {
                direction = { x: 0, y: -1 };
            } else if (event.key === "ArrowDown" && direction.y === 0) {
                direction = { x: 0, y: 1 };
            } else if (event.key === "ArrowLeft" && direction.x === 0) {
                direction = { x: -1, y: 0 };
            } else if (event.key === "ArrowRight" && direction.x === 0) {
                direction = { x: 1, y: 0 };
            }

            // Tarkista painettu näppäin event.key-arvosta
    // Päivitä suunta täällä
});


        function moveSnake() {
        const head = snake[0];
        const newHead = {
            x: head.x + direction.x,
            y: head.y + direction.y
        };
        if(newHead.x < 0 || newHead.x >= tileCount || newHead.y < 0 || newHead.y >= tileCount){
            clearInterval(gameInterval); 
            gameOver = true;
            document.getElementById("info").textContent =
    `Peli päättyi! Pisteet: ${score}`; 
            return;}
    
        const ateFood = newHead.x === food.x && newHead.y === food.y;
        if (ateFood) {
    score++; 
    document.getElementById("info").textContent =
    `Pisteet: ${score}`;
    food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
    };
} else {snake.pop();}

for (let i = 0; i < snake.length; i++) {
    // tarkista snake[i]
    if (newHead.x === snake[i].x && newHead.y === snake[i].y) {
        clearInterval(gameInterval); 
        gameOver = true; 
        document.getElementById("info").textContent =
    `Peli päättyi! Pisteet: ${score}`;
        return;
    }
}


snake.unshift(newHead);

        drawGame();
    }

    document.getElementById("restartButton").addEventListener("click", function() {
        gameOver = false;
        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        direction = { x: 1, y: 0 };
        food = { x: 15, y: 15 };
        score = 0;
        document.getElementById("info").textContent = `Pisteet: ${score}`;
        clearInterval(gameInterval);
        drawGame();
        gameInterval = setInterval(moveSnake, 150);

});

    gameInterval = setInterval(moveSnake, 150);

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================

        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
